<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1222"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mini Tetris"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Mini Tetris</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#28365f,#0a0e1a 70%);color:#f4f6ff;font:15px system-ui;padding:16px}.app{background:#11182be8;border:1px solid #ffffff22;border-radius:22px;padding:20px;box-shadow:0 24px 80px #0008;width:min(100%,560px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}h1{margin:0;letter-spacing:.15em;font-size:30px}.tag,.label{color:#9eacd0;font-size:11px;letter-spacing:.12em;text-transform:uppercase}button{border:0;border-radius:10px;background:#6958f5;color:white;font:inherit;font-weight:700;padding:10px 14px;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:16px;justify-content:center}.wrap{position:relative;width:100%;max-width:300px}canvas{display:block;width:100%;border-radius:10px;background:#0a1020;border:1px solid #34405d}#board{aspect-ratio:1/2}.overlay{position:absolute;inset:0;border-radius:10px;background:#080d1dcc;display:grid;place-items:center;text-align:center}.overlay.hidden{display:none}.overlay strong{font-size:24px}.overlay p{color:#b7c2df;font-size:13px}aside{display:grid;align-content:start;gap:9px}.stat,.next{padding:10px;border-radius:12px;background:#1a2340}.value{font-size:23px;font-weight:800;margin-top:2px}#next{height:80px;border:0;margin-top:5px}.help{font-size:11px;line-height:1.8;color:#aab5d4}.help b{color:white}.mobile{display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px auto 0;max-width:300px}.mobile button{font-size:19px;background:#252f51;padding:10px}.mobile .drop{background:#6958f5}.footer{text-align:center;color:#7180a8;font-size:11px;margin-top:10px}@media(max-width:480px){.app{padding:14px}.layout{grid-template-columns:minmax(0,1fr) 88px;gap:8px}.stat,.next{padding:8px}.value{font-size:19px}.help{font-size:9px}.mobile{display:grid}}
</style><main class="app"><header><div><div class="tag">Arcade clássico</div><h1>TETRIS</h1></div><button id="pause">Pausar</button></header><section class="layout"><div class="wrap"><canvas id="board" width="300" height="600"></canvas><div class="overlay" id="overlay"><div><strong id="title">Pronto?</strong><p id="msg">Toque em iniciar para começar a partida.</p><button id="resume">Iniciar</button></div></div></div><aside><div class="stat"><div class="label">Pontos</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">Recorde</div><div class="value" id="best">0</div></div><div class="stat"><div class="label">Linhas</div><div class="value" id="lines">0</div></div><div class="stat"><div class="label">Nível</div><div class="value" id="level">1</div></div><div class="next"><div class="label">Próxima</div><canvas id="next" width="120" height="80"></canvas></div><div class="help"><b>← →</b> mover<br><b>↑</b> girar<br><b>↓</b> descer<br><b>Espaço</b> queda<br><b>P</b> pausar</div></aside></section><div class="mobile"><button data-a="left">←</button><button data-a="rotate">↻</button><button data-a="right">→</button><button class="drop" data-a="drop">⇩</button></div><div class="footer">Use o teclado ou os controles na tela</div></main><script>
(()=>{const C=10,R=20,S=30,colors={I:'#47d7ff',O:'#ffd34e',T:'#b56cff',S:'#5ee38a',Z:'#ff627d',J:'#5388ff',L:'#ff9b52'},shapes={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};const cv=document.querySelector('#board'),ctx=cv.getContext('2d'),nc=document.querySelector('#next'),nctx=nc.getContext('2d'),ov=document.querySelector('#overlay');let grid,piece,next,score,lines,level,running=false,over=false,last=0,timer=0,best=+(localStorage.tetrisBest||0);document.querySelector('#best').textContent=best;function blank(){return Array.from({length:R},()=>Array(C).fill(''))}function rand(){let type=Object.keys(shapes)[Math.random()*7|0];return{type,m:shapes[type].map(r=>[...r]),x:0,y:0}}function spawn(){piece=next||rand();next=rand();piece.x=(C-piece.m[0].length)>>1;piece.y=0;drawNext();if(hit(piece,0,0,piece.m))end()}function hit(p,dx,dy,m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){let X=p.x+x+dx,Y=p.y+y+dy;if(X<0||X>=C||Y>=R||(Y>=0&&grid[Y][X]))return true}return false}function rotate(){let m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse());for(let k of [0,-1,1,-2,2])if(!hit(piece,k,0,m)){piece.x+=k;piece.m=m;break}}function lock(){piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=piece.type}));let n=0;for(let y=R-1;y>=0;y--)if(grid[y].every(Boolean)){grid.splice(y,1);grid.unshift(Array(C).fill(''));n++;y++}if(n){score+=[0,100,300,500,800][n]*level;lines+=n;level=lines/10|0;level++ ;stats()}spawn()}function move(dx,dy){if(!running||over)return false;if(!hit(piece,dx,dy,piece.m)){piece.x+=dx;piece.y+=dy;return true}if(dy)lock();return false}function drop(){if(!running||over)return;let d=0;while(!hit(piece,0,1,piece.m)){piece.y++;d++}score+=d*2;stats();lock()}function stats(){document.querySelector('#score').textContent=score.toLocaleString('pt-BR');document.querySelector('#lines').textContent=lines;document.querySelector('#level').textContent=level;if(score>best){best=score;localStorage.tetrisBest=best;document.querySelector('#best').textContent=best.toLocaleString('pt-BR')}}function cell(c,x,y,color,a=1){c.globalAlpha=a;c.fillStyle=color;c.fillRect(x*S+1,y*S+1,S-2,S-2);c.fillStyle='#ffffff33';c.fillRect(x*S+3,y*S+3,S-6,3);c.globalAlpha=1}function draw(){ctx.clearRect(0,0,300,600);ctx.fillStyle='#0a1020';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#ffffff0b';for(let x=0;x<=C;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke()}for(let y=0;y<=R;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke()}grid.forEach((r,y)=>r.forEach((v,x)=>{if(v)cell(ctx,x,y,colors[v])}));if(piece&&!over){let gy=piece.y;while(!hit({...piece,y:gy},0,1,piece.m))gy++;piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&gy+y>=0)cell(ctx,piece.x+x,gy+y,colors[piece.type],.2);if(v&&piece.y+y>=0)cell(ctx,piece.x+x,piece.y+y,colors[piece.type])}))}}function drawNext(){nctx.clearRect(0,0,120,80);let m=next.m,z=18,ox=(120-m[0].length*z)/2,oy=(80-m.length*z)/2;m.forEach((r,y)=>r.forEach((v,x)=>{if(v){nctx.fillStyle=colors[next.type];nctx.fillRect(ox+x*z+1,oy+y*z+1,z-2,z-2)}}))}function end(){over=true;running=false;document.querySelector('#title').textContent='Fim de jogo';document.querySelector('#msg').textContent='Sua pontuação: '+score.toLocaleString('pt-BR');document.querySelector('#resume').textContent='Jogar novamente';ov.classList.remove('hidden');document.querySelector('#pause').textContent='Recomeçar'}function toggle(){if(over)return reset();running=!running;ov.classList.toggle('hidden',running);document.querySelector('#title').textContent='Pausado';document.querySelector('#msg').textContent='Pressione continuar para voltar.';document.querySelector('#resume').textContent='Continuar';document.querySelector('#pause').textContent=running?'Pausar':'Continuar'}function reset(start=true){grid=blank();score=lines=0;level=1;running=start;over=false;next=null;ov.classList.toggle('hidden',start);document.querySelector('#pause').textContent=start?'Pausar':'Iniciar';document.querySelector('#title').textContent=start?'Pausado':'Pronto?';document.querySelector('#msg').textContent=start?'Pressione continuar para voltar.':'Toque em iniciar para começar a partida.';document.querySelector('#resume').textContent=start?'Continuar':'Iniciar';stats();spawn();draw()}function act(a){if(a==='pause')return toggle();if(a==='left')move(-1,0);if(a==='right')move(1,0);if(a==='down'){if(move(0,1)){score++;stats()}}if(a==='rotate'&&running&&!over)rotate();if(a==='drop')drop();draw()}document.addEventListener('keydown',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'rotate',' ':'drop',p:'pause',P:'pause'}[e.key];if(k){e.preventDefault();act(k)}});document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.a)}));document.querySelector('#pause').onclick=toggle;document.querySelector('#resume').onclick=toggle;function loop(t){let dt=t-last;last=t;if(running&&!over){timer+=dt;if(timer>Math.max(90,800-(level-1)*65)){move(0,1);timer=0}draw()}requestAnimationFrame(loop)}reset(false);requestAnimationFrame(loop)})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></html>
